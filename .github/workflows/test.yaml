name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The test suite mocks Home Assistant in tests/conftest.py, so no real `homeassistant`
        # install is needed. `voluptuous` is NOT mocked (config_flow imports it at module level),
        # so it must be installed for test collection to succeed.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio voluptuous

      - name: Run pytest
        # `python -m pytest` puts the repo root on sys.path so `import custom_components...` resolves.
        run: python -m pytest -v
