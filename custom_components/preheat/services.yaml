recompute:
  name: Recompute Decisions
  description: Forces the integration to re-evaluate potential preheat or coasting start times immediately.
  target:
    entity:
      integration: preheat
reset_model:
  name: Reset Thermal Model
  description: Wipes learned thermal parameters (Mass/Loss) and resets to profile defaults. Use this if the room characteristics changed significantly.
  target:
    entity:
      integration: preheat
reset_comfort_setpoint:
  name: Reset Learned Comfort Setpoint
  description: Forgets the learned comfort setpoint (used as preheat target while the thermostat is in setback). It is learned again during the next occupied period.
  target:
    entity:
      integration: preheat
